name: quickque_customer
description: "QuickQue Customer App - Local salon discovery and booking."
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking
  dio: ^5.4.1
  
  # Routing
  go_router: ^13.2.0
  google_sign_in: ^6.2.1
  firebase_auth: ^5.4.0
  firebase_core: ^3.0.0
  geolocator: ^13.0.1
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.2.2
  intl: ^0.20.3
  google_fonts: ^8.2.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/india_states_cities.json
